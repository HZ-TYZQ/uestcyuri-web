# 栏目按这里的顺序显示在导航与首页，id 对应 /id/ 网址。
# sections 决定该页面内的板块及顺序；将来可继续加入游戏、小说等板块。
pages:
  - id: creations
    title: 群友创作
    en: Creations
    intro: 群里画师们的图和汉化组的成果全在这边！以后有小说或游戏也会继续往里塞！
    quote:
      text: 我们，早已站在舞台之上。
      from: 少女☆歌剧 Revue Starlight 剧场版
    sections: [works, translations]
  - id: activities
    title: 群友日常
    en: Daily life
    intro: 群聊里刷出来的神奇名言，外加线上开黑和线下聚会的欢乐现场。
    sections: [quotes, activities]
  - id: recommendations
    title: 百合推荐
    en: Reading list
    intro: 不知道看啥玩啥？漫画、小说、游戏按架子排好队了，直接来挑！
    sections: [recommend]
  - id: resources
    title: 资源整理
    en: Resources
    intro: 群友脑洞一开搓出来的小工具，点开网页就能直接上手！
    sections: [resources]
  - id: about
    title: 关于我们
    en: About us
    intro: 这个小站是怎么诞生的，以及背后一起折腾的群友和 AI。
    sections: [about]

# 板块 id 不要改（页面靠它找到对应的组件）；标题和导语可以修改。
