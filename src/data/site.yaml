about:
  title: [因为同一种喜欢，, 才有了这些作品。]
  body: 这里是电子科技大学百合 ACG 交流群的作品展示页。从一部动画、一页漫画，到一段写下的故事，群友们把喜欢画成了画、写成了字、译成了中文，也把自己喜欢的作品推荐给你。
  note: 本站只做展示。

