about:
  title: [致，同样喜爱百合的你。]
  body: 这里是电子科技大学百合 ACG 交流群的展示页！平时大家在群里画画、做汉化、约游戏、互相安利喜欢的百合作品，好东西全沉在聊天记录里太可惜了，干脆搭个小站全部摆出来。地方不大，但只要能让你顺手挖到一两部戳中萌点的作品，我们就超开心了！
  note: 友情提示：本站纯展示不招新，不放群号也不放二维码哦。

