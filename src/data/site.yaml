# 站点文案：标题、首屏、各板块标题与导语、关于、页脚。
# 图片路径一律相对于根目录的 Pictures/ 文件夹来写，例如 logo/yuristc.png。

name: 电♥百                       # ♥ 会自动换成粉色 SVG 爱心
subtitle: 电子科技大学百合 ACG 交流群展示页面
groupName: 电子科技大学百合 ACG 交流群
description: 电子科技大学百合 ACG 交流群的作品展示页：群友作品、汉化、金句、活动与百合推荐。
logo: logo/yuristc.png
repo: https://github.com/HZ-TYZQ/uestcyuri-web

hero:
  eyebrow: FOR ANYONE WHO LOVES HER STORIES
  title: [喜欢百合的你，, 欢迎来看看]         # 每项一行，最后自动加粉色句号
  intro: 我们是电子科大一群喜欢百合的人。这里摆着大家的画、译作和书单，随便看看，希望有一件你也喜欢。
  primary: { label: 先看看大家的作品, href: "/creations/" }
  secondary: { label: 给我推荐一部, href: "/recommendations/" }
  image: works/Aurora/OC3.jpg
  imageAlt: Aurora 的原创角色插画：两个女孩比心
  imageAuthor: Aurora
  imageLabel: 原创角色
  vertical: 画下的 · 译过的 · 推荐的
  caption: 进门第一眼，是群友的画。

strip:
  left: 电子科技大学百合 ACG 交流群 · 写给同好的展示页
  right: Come for the art, stay for the yuri

# 栏目按这里的顺序显示在导航与首页，id 对应 /id/ 网址。
# sections 决定该页面内的板块及顺序；将来可继续加入游戏、小说等板块。
pages:
  - id: creations
    title: 群友创作
    en: Creations
    intro: 画下的、写下的、译下的，把喜欢变成自己的作品。
    quote:
      text: 我们，早已站在舞台之上。
      from: 少女☆歌剧 Revue Starlight 剧场版
    sections: [works, translations]
  - id: activities
    title: 群友日常
    en: Daily life
    intro: 说过的话，一起玩过的时光，都在这里留下记录。
    sections: [quotes, activities]
  - id: recommendations
    title: 百合推荐
    en: Reading list
    intro: 从漫画、小说到游戏，翻开下一段她与她的故事。
    sections: [recommend]
  - id: resources
    title: 资源整理
    en: Resources
    intro: 收藏工具、资料和链接，留给同样喜欢的你。
    sections: [resources]
  - id: about
    title: 关于我们
    en: About us
    intro: 因为同一种喜欢，才有了这里。
    sections: [about]

# 板块 id 不要改（页面靠它找到对应的组件）；标题和导语可以修改。
sections:
  - { id: works,        title: 群友的作品, tagline: 这些是群友亲手做出来的，希望你也喜欢。, en: Works }
  - { id: translations, title: 群友的汉化, tagline: 伟大的汉化组！欢迎品鉴。, en: Translations }
  - { id: quotes,       title: 群聊金句, tagline: 欣赏群友们的"至理名言"。, en: Overheard, more: 更多金句还在整理。 }
  - { id: activities,   title: 一起玩过, tagline: 群友一起玩过的游戏和活动，留个纪念。, en: Gatherings }
  - { id: recommend,    title: 给你的推荐, tagline: “有哪些优秀的百合同人作品？” ——邓煜, en: For you }
  - { id: resources, title: 资源整理, en: Resources }
  - { id: about,        title: 关于这里, en: About }

