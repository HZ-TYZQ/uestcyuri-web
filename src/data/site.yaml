  title: [致，同样喜爱百合的你。]
  body: 这里是电子科技大学百合 ACG 交流群的展示页。群友们把喜欢画成了画、写成了字、译成了中文；如果你刚好也喜欢，这一页就是写给你的。
  note: 本站只做展示。

