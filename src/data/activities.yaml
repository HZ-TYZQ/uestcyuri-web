- title: 涂鸦躲猫猫
  date: 2026-10-01
  intro: 群友们开着语音玩涂鸦躲猫猫，在 Yuri Art Gallery 里顺便逛了场百合画展，拿着涂鸦枪找人的同时，也忍不住停下来看看画。换到其他地图，又留下了枪手奶龙，以及躺在棋盘格地板上、被大家围观的两只企鹅（群友，左一）。
