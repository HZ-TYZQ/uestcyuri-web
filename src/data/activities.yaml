- title: 线下K歌
  date: 2026-09-26
  intro: 群友们线下聚在 KTV，轮流点歌、合唱，唱了一下午。合照里每个人的脸都用自己的群头像挡住了，活像「灵位」；正中间还 P 上了群管的头像——《荒野乱斗》的斯派克，被 AI 娘化成了红发少女。
  details:
    - { label: 形式, value: 线下 }
  shots:
    - activities/karaoke/K歌.jpeg

